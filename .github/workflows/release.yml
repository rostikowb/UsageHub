name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: cargo-audit
            version: 0.22.2
            command: cargo audit --file Cargo.lock
          - tool: cargo-deny
            version: 0.20.2
            command: cargo deny --locked check
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install security tool
        run: cargo install --locked ${{ matrix.tool }} --version ${{ matrix.version }}
      - name: Check dependencies
        run: ${{ matrix.command }}

  build:
    needs: dependency-security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Override the local gnullvm host and target with the hosted MSVC toolchain.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test updater safeguards
        run: cargo test --locked --target x86_64-pc-windows-msvc updater

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/x86_64-pc-windows-msvc/release/usagehub.exe
          generate_release_notes: true
